name: AlgoHar V2

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "v2/**"
      - "docs/product-manifest.json"
      - "docs/algohar-v2-product-spec.md"
      - "docs/ip-clean-room.md"
      - "docs/launch-readiness.md"
      - "docs/payment-entitlement-durability.md"
      - "docs/project-twin.json"
      - "docs/project-journeys.json"
      - ".github/workflows/algohar-v2.yml"
  push:
    branches:
      - "master"
    paths:
      - "v2/**"
      - "docs/ip-clean-room.md"
      - "docs/launch-readiness.md"
      - "docs/payment-entitlement-durability.md"
      - "docs/project-twin.json"
      - "docs/project-journeys.json"
      - ".github/workflows/algohar-v2.yml"

concurrency:
  group: algohar-v2-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: v2
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Verify Project Intelligence producer contracts
        run: |
          node - <<'NODE'
          const fs = require('node:fs')
          const twin = JSON.parse(fs.readFileSync('../docs/project-twin.json', 'utf8'))
          const journeys = JSON.parse(fs.readFileSync('../docs/project-journeys.json', 'utf8'))
          const requiredFalse = ['raw_http_bodies', 'raw_http_headers', 'cookies', 'authorization', 'customer_rows', 'private_messages']
          if (!twin || typeof twin !== 'object' || !twin.surfaces || !twin.privacy) throw new Error('invalid project twin')
          for (const key of requiredFalse) {
            if (twin.privacy[key] !== false) throw new Error(`unsafe project twin privacy field: ${key}`)
          }
          if (!journeys || !Array.isArray(journeys.journeys) || journeys.journeys.length < 3) throw new Error('explicit project journeys required')
          for (const journey of journeys.journeys) {
            if (!journey.id || !journey.outcome || !Array.isArray(journey.steps) || journey.steps.length === 0) throw new Error('invalid project journey')
          }
          NODE
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Commit generated V2 lockfile
        if: github.event_name == 'pull_request'
        working-directory: .
        run: |
          if git ls-files --error-unmatch v2/package-lock.json >/dev/null 2>&1; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add v2/package-lock.json
          git commit -m 'chore: lock V2 dependency graph'
          git push origin HEAD:${{ github.head_ref }}
      - name: Verify commercial clean-room boundary
        run: npm run verify:clean-room
      - name: Verify algorithm catalog
        run: npm run verify:algorithms
      - name: Verify algorithm semantics
        run: npm run verify:semantics
      - name: Verify payment and transactional outbox contracts
        run: npm run verify:payments
      - name: Verify mastery and spaced-review contract
        run: npm run verify:learning
      - name: Verify growth and SEO contract
        run: npm run verify:growth
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Production build
        run: npm run build
      - name: Install Chromium for product QA
        run: npx playwright install --with-deps chromium
      - name: Desktop and mobile product QA
        run: npm run test:e2e
