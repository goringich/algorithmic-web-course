name: AlgoHar V2

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "v2/**"
      - "docs/product-manifest.json"
      - "docs/algohar-v2-product-spec.md"
      - "docs/ip-clean-room.md"
      - ".github/workflows/algohar-v2.yml"
  push:
    branches:
      - "master"
    paths:
      - "v2/**"
      - "docs/ip-clean-room.md"
      - ".github/workflows/algohar-v2.yml"

concurrency:
  group: algohar-v2-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: v2
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Verify commercial clean-room boundary
        run: npm run verify:clean-room
      - name: Verify algorithm catalog
        run: npm run verify:algorithms
      - name: Verify algorithm semantics
        run: npm run verify:semantics
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Production build
        run: npm run build
