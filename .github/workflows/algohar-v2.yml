name: AlgoHar V2

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "v2/**"
      - ".gitignore"
      - "BackEnd/.env"
      - "docs/product-manifest.json"
      - "docs/algohar-v2-product-spec.md"
      - "docs/ip-clean-room.md"
      - "docs/launch-readiness.md"
      - "docs/payment-entitlement-durability.md"
      - "docs/project-twin.json"
      - "docs/project-journeys.json"
      - "docs/release-profile.json"
      - "docs/security-passport.json"
      - "docs/autonomy-profile.json"
      - ".github/workflows/algohar-v2.yml"
  push:
    branches:
      - "master"
    paths:
      - "v2/**"
      - ".gitignore"
      - "BackEnd/.env"
      - "docs/product-manifest.json"
      - "docs/ip-clean-room.md"
      - "docs/launch-readiness.md"
      - "docs/payment-entitlement-durability.md"
      - "docs/project-twin.json"
      - "docs/project-journeys.json"
      - "docs/release-profile.json"
      - "docs/security-passport.json"
      - "docs/autonomy-profile.json"
      - ".github/workflows/algohar-v2.yml"

concurrency:
  group: algohar-v2-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: v2
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Verify Project Intelligence producer contracts
        run: |
          node - <<'NODE'
          const fs = require('node:fs')
          const twin = JSON.parse(fs.readFileSync('../docs/project-twin.json', 'utf8'))
          const journeys = JSON.parse(fs.readFileSync('../docs/project-journeys.json', 'utf8'))
          const requiredFalse = ['raw_http_bodies', 'raw_http_headers', 'cookies', 'authorization', 'customer_rows', 'private_messages']
          if (!twin || typeof twin !== 'object' || !twin.surfaces || !twin.privacy) throw new Error('invalid project twin')
          for (const key of requiredFalse) {
            if (twin.privacy[key] !== false) throw new Error(`unsafe project twin privacy field: ${key}`)
          }
          if (!journeys || !Array.isArray(journeys.journeys) || journeys.journeys.length < 3) throw new Error('explicit project journeys required')
          for (const journey of journeys.journeys) {
            if (!journey.id || !journey.outcome || !Array.isArray(journey.steps) || journey.steps.length === 0) throw new Error('invalid project journey')
          }
          NODE
      - name: Verify release security and autonomy adoption
        run: |
          node - <<'NODE'
          const fs = require('node:fs')
          const release = JSON.parse(fs.readFileSync('../docs/release-profile.json', 'utf8'))
          const security = JSON.parse(fs.readFileSync('../docs/security-passport.json', 'utf8'))
          const autonomy = JSON.parse(fs.readFileSync('../docs/autonomy-profile.json', 'utf8'))
          const gateStates = new Set(['pass', 'fail', 'unknown', 'stale', 'not_applicable'])
          const autonomyStates = new Set(['pass', 'fail', 'unknown', 'stale', 'not_applicable', 'verified'])

          if (release.product_id !== 'algohar') throw new Error('release profile product mismatch')
          if (release.release_authority !== 'repository_owned') throw new Error('release authority must remain repository-owned')
          if (!release.current_release || typeof release.current_release.feature_freeze !== 'boolean') throw new Error('release feature-freeze state required')
          if (typeof release.current_release.candidate_sha !== 'string') throw new Error('release candidate sha state required')
          if (!release.current_release.candidate_sha && !release.current_release.blocker) throw new Error('missing candidate must remain blocked')
          if (release.external_release_requested === true && !release.current_release.candidate_sha) throw new Error('external release cannot be requested without candidate sha')

          if (security.product_id !== 'algohar') throw new Error('security passport product mismatch')
          if (security.security_tier !== 'payments_or_privileged_actions') throw new Error('payments security tier required')
          if (!security.gates || typeof security.gates !== 'object') throw new Error('security gates required')
          for (const required of ['exact_head_ci', 'independent_security_review', 'live_post_deploy_security_probe']) {
            if (!security.gates[required]) throw new Error(`missing security gate: ${required}`)
          }
          for (const [id, gate] of Object.entries(security.gates)) {
            if (!gate || typeof gate !== 'object' || !gateStates.has(gate.status)) throw new Error(`invalid security gate state: ${id}`)
            if (gate.status === 'pass' && !String(gate.evidence || '').trim()) throw new Error(`passing security gate lacks evidence: ${id}`)
            if (!String(gate.next_action || '').trim()) throw new Error(`security gate lacks next action: ${id}`)
          }

          if (autonomy.product_id !== 'algohar') throw new Error('autonomy profile product mismatch')
          if (autonomy.target_level !== 'A5_exception_only_owner') throw new Error('autonomy target mismatch')
          if (!autonomy.domains || typeof autonomy.domains !== 'object' || Object.keys(autonomy.domains).length === 0) throw new Error('autonomy domains required')
          for (const [id, domain] of Object.entries(autonomy.domains)) {
            if (!domain || typeof domain !== 'object' || !autonomyStates.has(domain.status)) throw new Error(`invalid autonomy domain state: ${id}`)
            if (!Array.isArray(domain.evidence)) throw new Error(`autonomy evidence must be an array: ${id}`)
            if (!String(domain.next_action || '').trim()) throw new Error(`autonomy domain lacks next action: ${id}`)
          }
          NODE
          tracked_env="$(git -C .. ls-files | grep -E '(^|/)\.env($|\.)' | grep -Ev '\.(example|sample|template)$' || true)"
          if [[ -n "${tracked_env}" ]]; then
            echo 'tracked non-template env file detected' >&2
            printf '%s\n' "${tracked_env}" >&2
            exit 1
          fi
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify commercial clean-room boundary
        run: npm run verify:clean-room
      - name: Verify algorithm catalog
        run: npm run verify:algorithms
      - name: Verify algorithm semantics
        run: npm run verify:semantics
      - name: Verify payment and transactional outbox contracts
        run: npm run verify:payments
      - name: Verify mastery and spaced-review contract
        run: npm run verify:learning
      - name: Verify growth and SEO contract
        run: npm run verify:growth
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Production build
        run: npm run build
      - name: Install Chromium for product QA
        run: npx playwright install --with-deps chromium
      - name: Desktop and mobile product QA
        run: npm run test:e2e
